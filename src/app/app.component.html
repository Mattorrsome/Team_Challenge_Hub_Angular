<mat-toolbar color="primary">
  <a class="app-title" routerLink="/">Team Challenge Hub</a>
  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <span class="app-username">{{ user.username }}</span>
  }

  <button
    class="app-theme-toggle"
    mat-icon-button
    type="button"
    [attr.aria-label]="
      themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
    "
    [matTooltip]="
      themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
    "
    (click)="themeService.toggle()"
  >
    <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  @if (auth.currentUser()) {
    @if (auth.isAdmin()) {
      <a
        class="app-admin-link"
        mat-icon-button
        routerLink="/admin/users"
        aria-label="Users"
        matTooltip="Users"
      >
        <mat-icon>group</mat-icon>
      </a>
    }
    <button
      class="app-sign-out"
      mat-icon-button
      type="button"
      aria-label="Sign out"
      matTooltip="Sign out"
      (click)="onSignOut()"
    >
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<router-outlet />
