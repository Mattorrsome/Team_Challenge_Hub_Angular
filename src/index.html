<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TeamChallengeHubAngular</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      // ThemeService (src/app/core/theme/theme.service.ts) owns this at runtime;
      // both must agree on the 'tch_theme' key and the light/dark values.
      document.documentElement.style.colorScheme =
        localStorage.getItem('tch_theme') === 'dark' ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
